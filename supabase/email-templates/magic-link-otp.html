<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zibidi — doğrulama kodu</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#0a0a0a;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background-color:#1a1a1a;border-radius:16px;border:1px solid rgba(255,255,255,0.08);">
          <tr>
            <td style="padding:32px 28px;text-align:center;">
              <p style="margin:0 0 8px;font-size:13px;color:#e85d4a;letter-spacing:1px;font-weight:600;text-transform:uppercase;">Zibidi</p>
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;color:#ffffff;">Hesabını doğrula</h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.5;color:#b0b0b0;">
                Kayıt işlemini tamamlamak için aşağıdaki 6 haneli kodu uygulamaya gir.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" align="center" style="margin:0 auto;">
                <tr>
                  <td style="padding:16px 28px;background-color:#2a2a2a;border-radius:12px;border:1px solid rgba(255,255,255,0.12);">
                    <span style="font-size:32px;font-weight:700;letter-spacing:8px;color:#ffffff;font-family:'SF Mono',ui-monospace,monospace;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#666666;">
                Bu kod kısa süre geçerlidir. Kimseyle paylaşma.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#555555;max-width:420px;text-align:center;">
          Bu e-postayı sen talep etmediysen güvenle yok sayabilirsin.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
